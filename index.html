<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#355d4b">
  <title>오늘의 할 일</title>
  <style>
    * { box-sizing: border-box; }
    body { margin: 0; min-height: 100vh; background: #f6f5f0; color: #273c31; font-family: "Malgun Gothic", system-ui, sans-serif; }
    main { width: min(100% - 40px, 640px); margin: 90px auto; }
    .eyebrow { color: #6b806f; font-size: 12px; font-weight: 700; letter-spacing: .18em; }
    h1 { margin: 14px 0 12px; font-size: clamp(32px, 7vw, 44px); letter-spacing: -.06em; }
    .intro { color: #778076; font-size: 15px; line-height: 1.7; margin-bottom: 32px; }
    .card { padding: 28px; border: 1px solid #e3e6dc; background: #fffefa; border-radius: 24px; box-shadow: 0 16px 50px #273c3108; }
    form { display: flex; gap: 10px; }
    input[type="text"] { width: 100%; min-width: 0; border: 1px solid #dce2d7; background: white; border-radius: 12px; padding: 16px; font: inherit; color: inherit; }
    input::placeholder { color: #929a91; }
    button { font: inherit; cursor: pointer; }
    .add { flex-shrink: 0; border: 0; padding: 0 22px; border-radius: 12px; color: white; background: #355d4b; font-weight: 700; }
    .add:hover { background: #254735; }
    :focus-visible { outline: 3px solid #9fbda6; outline-offset: 3px; }
    .summary { display: flex; align-items: center; justify-content: space-between; gap: 10px; padding: 25px 0 16px; border-bottom: 1px solid #ecede6; font-size: 13px; }
    .count { color: #7b857b; }
    .count strong { color: #355d4b; }
    ul { list-style: none; padding: 0; margin: 0; }
    li { display: flex; gap: 12px; align-items: center; padding: 18px 0; border-bottom: 1px solid #ecede6; }
    li:last-child { border-bottom: 0; }
    label { display: flex; gap: 13px; align-items: center; flex: 1; min-width: 0; cursor: pointer; }
    input[type="checkbox"] { width: 21px; height: 21px; margin: 0; flex-shrink: 0; accent-color: #355d4b; cursor: pointer; }
    .task-text { line-height: 1.6; overflow-wrap: anywhere; }
    .done .task-text { text-decoration: line-through; color: #939c91; }
    .task-group { margin-top: 24px; }
    .group-title { display: flex; align-items: center; gap: 8px; margin: 0; font-size: 14px; }
    .group-count { color: #7b857b; font-size: 12px; font-weight: 400; }
    .group-empty { color: #939c91; font-size: 13px; padding: 10px 0; margin: 0; }
    .task-state { max-width: 90px; border: 1px solid #dce2d7; border-radius: 8px; padding: 8px 5px; font: inherit; font-size: 12px; color: #355d4b; background: #f5f7f0; cursor: pointer; }
    .task-state[data-state="doing"] { background: #fff5db; color: #7e5a12; }
    .task-state[data-state="done"] { background: #eaf2e8; }
    .delete { flex-shrink: 0; border: 0; border-radius: 8px; background: transparent; color: #8c9389; padding: 8px 10px; font-size: 12px; }
    .delete:hover { background: #fbefeb; color: #b45f50; }
    .empty { text-align: center; padding: 42px 5px 25px; color: #899184; font-size: 14px; line-height: 1.8; }
    .empty-icon { font-size: 28px; margin-bottom: 12px; color: #6f8c6f; }
    [hidden] { display: none !important; }
    footer { text-align: center; color: #93998e; font-size: 12px; margin-top: 23px; line-height: 1.8; }
    .sr-only { position: absolute; width: 1px; height: 1px; overflow: hidden; clip-path: inset(50%); white-space: nowrap; }
    .account-bar { display: flex; justify-content: flex-end; align-items: center; gap: 12px; flex-wrap: wrap; padding: 20px 28px 0; }
    .account-email { max-width: min(60vw, 360px); overflow-wrap: anywhere; font-size: 13px; }
    .account-button { border: 1px solid #d5dfd0; border-radius: 10px; background: #fffefa; color: #355d4b; padding: 10px 16px; }
    .account-button:hover { background: #eaf2e8; }
    button:disabled { opacity: .6; cursor: wait; }
    dialog { width: min(420px, calc(100% - 32px)); padding: 28px; border: 1px solid #e3e6dc; border-radius: 20px; background: #fffefa; color: #273c31; box-shadow: 0 20px 80px #273c3126; }
    dialog::backdrop { background: #1f352b80; }
    .auth-heading { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; gap: 12px; }
    .auth-heading h2 { margin: 0; font-size: 24px; }
    .close-dialog { border: 0; background: none; color: #6b806f; font-size: 24px; padding: 0 5px; }
    #auth-form { display: flex; flex-direction: column; gap: 10px; }
    #auth-form label { flex: none; display: block; margin-top: 8px; font-size: 14px; }
    #auth-form input { width: 100%; border: 1px solid #dce2d7; border-radius: 10px; padding: 13px; color: inherit; font: inherit; background: white; }
    #auth-submit { padding: 14px; margin-top: 12px; }
    .auth-toggle { display: block; margin: 18px auto 0; border: 0; background: transparent; color: #355d4b; text-decoration: underline; text-underline-offset: 4px; font-size: 13px; }
    .auth-message { font-size: 13px; line-height: 1.7; white-space: pre-line; }
    .auth-message[data-error="true"] { color: #a33d30; }
    #account-message { margin: 8px 28px 0; text-align: right; }
    @media (max-width: 480px) { main { margin: 48px auto; width: calc(100% - 28px); } .card { padding: 20px; } .add { padding: 0 17px; } }
  </style>
</head>
<body>
  <header class="account-bar" aria-label="내 계정">
    <span class="account-email" id="account-email" hidden></span>
    <button class="account-button" id="login-button" type="button">로그인</button>
    <button class="account-button" id="logout-button" type="button" hidden>로그아웃</button>
  </header>
  <p id="account-message" class="auth-message" role="status" hidden></p>
  <dialog id="auth-dialog" aria-labelledby="auth-title">
    <div class="auth-heading">
      <h2 id="auth-title">로그인</h2>
      <button class="close-dialog" id="auth-close" type="button" aria-label="팝업 닫기">×</button>
    </div>
    <form id="auth-form">
      <label for="auth-email">이메일</label>
      <input id="auth-email" type="email" autocomplete="email" placeholder="name@example.com" required autofocus>
      <label for="auth-password">비밀번호</label>
      <input id="auth-password" type="password" autocomplete="current-password" placeholder="비밀번호를 입력하세요" required>
      <p id="auth-message" class="auth-message" role="status" hidden></p>
      <button id="auth-submit" class="add" type="submit">로그인</button>
    </form>
    <button id="auth-toggle" class="auth-toggle" type="button">계정이 없으신가요? 회원가입</button>
  </dialog>
  <main>
    <div class="eyebrow">A LITTLE PROGRESS, EVERY DAY</div>
    <h1>오늘의 할 일<span style="color:#7d9b70">.</span></h1>
    <p class="intro">머릿속 할 일을 가볍게 꺼내놓으세요.<br>작은 실천 하나가 알찬 하루를 만듭니다.</p>
    <section class="card" aria-label="할 일 관리">
      <form id="task-form">
        <label for="task-input" class="sr-only">새로운 할 일</label>
        <input id="task-input" type="text" placeholder="어떤 일을 해볼까요?" maxlength="300" required autocomplete="off">
        <button type="submit" class="add">추가</button>
      </form>
      <div class="summary"><strong>나의 목록</strong><span class="count" id="count" aria-live="polite"></span></div>
      <div id="task-list" aria-label="상태별 할 일 목록"></div>
      <div class="empty" id="empty"><div class="empty-icon" aria-hidden="true">✳</div>아직 등록한 할 일이 없어요.<br>오늘 해보고 싶은 일을 적어보세요.</div>
      <p id="status" class="sr-only" role="status"></p>
    </section>
    <footer id="save-note">이 브라우저에 자동으로 저장돼요.</footer>
  </main>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script>
    (() => {
      'use strict';
      const $ = selector => document.querySelector(selector);
      const dialog = $('#auth-dialog');
      const form = $('#auth-form');
      const email = $('#auth-email');
      const password = $('#auth-password');
      const submit = $('#auth-submit');
      const toggle = $('#auth-toggle');
      let mode = 'login';
      let clientPromise;
      let busy = false;

      function message(node, text = '', error = false) {
        node.textContent = text;
        node.hidden = !text;
        node.dataset.error = String(error);
      }
      function updateAccount(session) {
        const signedIn = Boolean(session?.user);
        $('#account-email').textContent = session?.user?.email || '';
        $('#account-email').hidden = !signedIn;
        $('#login-button').hidden = signedIn;
        $('#logout-button').hidden = !signedIn;
      }
      function errorText(error) {
        const code = error?.code;
        if (code === 'invalid_credentials') return '이메일 또는 비밀번호를 확인해주세요.';
        if (code === 'email_not_confirmed') return '이메일의 가입 확인 링크를 먼저 눌러주세요.';
        if (code === 'over_email_send_rate_limit' || error?.status === 429) return '요청 한도에 도달했어요. 잠시 후 다시 시도해주세요.';
        if (code === 'user_already_exists') return '이미 가입된 이메일이에요. 로그인으로 전환해주세요.';
        if (code === 'weak_password') return '비밀번호가 보안 조건에 맞지 않아요. 더 길고 다양한 문자로 입력해주세요.';
        if (code === 'signup_disabled') return '현재 회원가입을 사용할 수 없어요.';
        return error?.userMessage || '요청을 완료하지 못했어요. 네트워크 연결을 확인하고 다시 시도해주세요.';
      }
      async function getClient() {
        if (!clientPromise) {
          clientPromise = (async () => {
            if (!window.supabase?.createClient) throw new Error('SDK unavailable');
            if (!/^https?:$/.test(window.location.protocol)) {
              throw { userMessage: '로그인은 배포된 웹앱 주소에서 이용해주세요.' };
            }
            const response = await fetch('/api/supabase-config', { cache: 'no-store' });
            if (!response.ok) throw { userMessage: '로그인 연결 설정을 불러오지 못했어요. 잠시 후 다시 시도해주세요.' };
            const config = await response.json();
            const client = window.supabase.createClient(config.url, config.publishableKey);
            client.auth.onAuthStateChange((_event, session) => {
              updateAccount(session);
              if (session && dialog.open) {
                dialog.close();
                password.value = '';
                message($('#account-message'));
              }
            });
            const { data, error } = await client.auth.getSession();
            if (error) throw error;
            updateAccount(data.session);
            return client;
          })().catch(error => { clientPromise = null; throw error; });
        }
        return clientPromise;
      }
      function setMode(nextMode) {
        mode = nextMode;
        const signup = mode === 'signup';
        $('#auth-title').textContent = signup ? '회원가입' : '로그인';
        submit.textContent = signup ? '회원가입' : '로그인';
        toggle.textContent = signup ? '이미 계정이 있으신가요? 로그인' : '계정이 없으신가요? 회원가입';
        password.autocomplete = signup ? 'new-password' : 'current-password';
        password.minLength = signup ? 6 : 1;
        password.value = '';
        message($('#auth-message'));
      }
      function setBusy(value) {
        busy = value;
        [email, password, submit, toggle, $('#login-button')].forEach(node => { node.disabled = value; });
        submit.textContent = value ? '처리 중…' : (mode === 'signup' ? '회원가입' : '로그인');
        form.setAttribute('aria-busy', String(value));
      }
      $('#login-button').addEventListener('click', () => {
        if (busy) return;
        setMode('login');
        message($('#account-message'));
        dialog.showModal();
      });
      $('#auth-close').addEventListener('click', () => dialog.close());
      dialog.addEventListener('close', () => { password.value = ''; });
      toggle.addEventListener('click', () => {
        if (!busy) setMode(mode === 'login' ? 'signup' : 'login');
      });
      form.addEventListener('submit', async event => {
        event.preventDefault();
        if (busy || !form.reportValidity()) return;
        setBusy(true);
        message($('#auth-message'));
        try {
          const client = await getClient();
          const credentials = { email: email.value.trim(), password: password.value };
          const result = mode === 'signup'
            ? await client.auth.signUp({ ...credentials, options: { emailRedirectTo: window.location.origin + '/' } })
            : await client.auth.signInWithPassword(credentials);
          if (result.error) throw result.error;
          password.value = '';
          if (result.data.session) {
            updateAccount(result.data.session);
            dialog.close();
            message($('#account-message'), '로그인했어요.');
          } else if (mode === 'signup') {
            setMode('login');
            message($('#auth-message'), '가입 확인이 필요할 수 있어요. 받은 메일함의 확인 링크를 누른 뒤 로그인해주세요.');
          }
        } catch (error) {
          message($('#auth-message'), errorText(error), true);
        } finally { setBusy(false); }
      });
      $('#logout-button').addEventListener('click', async () => {
        const button = $('#logout-button');
        button.disabled = true;
        message($('#account-message'));
        try {
          const client = await getClient();
          const { error } = await client.auth.signOut({ scope: 'local' });
          if (error) throw error;
          updateAccount(null);
          password.value = '';
          message($('#account-message'), '로그아웃했어요.');
        } catch (error) { message($('#account-message'), errorText(error), true); }
        finally { button.disabled = false; }
      });
      getClient().catch(error => message($('#account-message'), errorText(error), true));
    })();
  </script>
  <script>
    'use strict';
    const storageKey = 'today-todos-v1';
    const form = document.querySelector('#task-form');
    const input = document.querySelector('#task-input');
    const list = document.querySelector('#task-list');
    const status = document.querySelector('#status');
    const groups = [
      { value: 'pending', label: '못함', empty: '아직 시작하지 않은 일이 없어요.' },
      { value: 'doing', label: '진행중', empty: '진행 중인 일이 없어요.' },
      { value: 'done', label: '완료', empty: '완료한 일이 여기에 모여요.' }
    ];
    let tasks = [];
    try {
      const saved = JSON.parse(localStorage.getItem(storageKey) || '[]');
      if (Array.isArray(saved)) tasks = saved
        .filter(task => task && typeof task.text === 'string' && (groups.some(group => group.value === task.state) || typeof task.done === 'boolean'))
        .map(task => ({ text: task.text, state: groups.some(group => group.value === task.state) ? task.state : (task.done ? 'done' : 'pending') }));
    } catch { document.querySelector('#save-note').textContent = '저장된 목록을 불러오지 못했어요. 새 목록으로 시작합니다.'; }
    function save() {
      try { localStorage.setItem(storageKey, JSON.stringify(tasks)); }
      catch { document.querySelector('#save-note').textContent = '자동 저장을 사용할 수 없어요. 창을 닫으면 목록이 사라질 수 있어요.'; }
    }
    function render() {
      list.replaceChildren();
      groups.forEach(group => {
        const section = document.createElement('section');
        section.className = 'task-group';
        section.setAttribute('aria-label', group.label + ' 목록');
        const heading = document.createElement('h2');
        heading.className = 'group-title';
        heading.textContent = group.label;
        const count = document.createElement('span');
        count.className = 'group-count';
        count.textContent = tasks.filter(task => task.state === group.value).length + '개';
        heading.append(count);
        const groupList = document.createElement('ul');
        tasks.filter(task => task.state === group.value).forEach(task => {
        const row = document.createElement('li');
        row.classList.toggle('done', task.state === 'done');
        const label = document.createElement('label');
        const checkbox = document.createElement('input');
        checkbox.type = 'checkbox';
        checkbox.checked = task.state === 'done';
        checkbox.setAttribute('aria-label', task.text + ' 완료');
        const text = document.createElement('span');
        text.className = 'task-text';
        text.textContent = task.text;
        checkbox.addEventListener('change', () => {
          changeState(task, checkbox.checked ? 'done' : 'pending', 'input');
        });
        label.append(checkbox, text);
        const select = document.createElement('select');
        select.className = 'task-state';
        select.dataset.state = task.state;
        select.setAttribute('aria-label', task.text + ' 상태');
        groups.forEach(optionGroup => {
          const option = document.createElement('option');
          option.value = optionGroup.value;
          option.textContent = optionGroup.label;
          select.append(option);
        });
        select.value = task.state;
        select.addEventListener('change', () => changeState(task, select.value, 'select'));
        const button = document.createElement('button');
        button.type = 'button';
        button.className = 'delete';
        button.textContent = '삭제';
        button.setAttribute('aria-label', task.text + ' 삭제');
        button.addEventListener('click', () => {
          const position = Array.from(list.querySelectorAll('.delete')).indexOf(button);
          tasks.splice(tasks.indexOf(task), 1);
          save();
          render();
          const buttons = list.querySelectorAll('.delete');
          (buttons[Math.min(position, buttons.length - 1)] || input).focus();
          status.textContent = '할 일을 삭제했어요.';
        });
        row.append(label, select, button);
        row.task = task;
        groupList.append(row);
        });
        section.append(heading, groupList);
        if (!groupList.children.length) {
          const empty = document.createElement('p');
          empty.className = 'group-empty';
          empty.textContent = group.empty;
          section.append(empty);
        }
        list.append(section);
      });
      updateCount();
    }
    function changeState(task, state, control) {
      task.state = state;
      save();
      render();
      const row = Array.from(list.querySelectorAll('li')).find(item => item.task === task);
      row.querySelector(control).focus();
      status.textContent = groups.find(group => group.value === state).label + ' 목록으로 이동했어요.';
    }
    function updateCount() {
      const done = tasks.filter(task => task.state === 'done').length;
      document.querySelector('#count').textContent = `전체 ${tasks.length} · 완료 ${done}`;
      document.querySelector('#empty').hidden = tasks.length > 0;
      list.hidden = tasks.length === 0;
    }
    form.addEventListener('submit', event => {
      event.preventDefault();
      const text = input.value.trim();
      if (!text) { input.value = ''; input.focus(); return; }
      tasks.push({ text, state: 'pending' });
      save();
      render();
      input.value = '';
      input.focus();
      status.textContent = '할 일을 추가했어요.';
    });
    render();
  </script>
</body>
</html>
